name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        # No Firebase credentials in CI. lib/db.ts only throws for a missing
        # service account at request time, and every page that touches
        # Firestore is dynamic, so the build does not need them.
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ci_placeholder_secret_value_32_chars
          BETTER_AUTH_URL: http://localhost:3000
          FIREBASE_PROJECT_ID: demo-ci
